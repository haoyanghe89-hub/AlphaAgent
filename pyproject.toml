[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marketpulse-agent"
version = "0.1.0"
description = "CLI market research agent powered by DeepSeek and public web search"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "beautifulsoup4>=4.13,<5",
  "ddgs>=9,<10",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai-agents==0.22.2",
  "pypdf>=5,<7",
  "pydantic>=2.11,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "tokenizers==0.22.2",
  "typer>=0.16,<1",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
quant = [
  "pandas==3.0.6; python_version >= '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
  "pyarrow==25.0.1; python_version >= '3.12'",
  "duckdb==1.5.6; python_version >= '3.12'",
  "akshare==1.19.1; python_version >= '3.12'",
  "baostock==0.9.4; python_version >= '3.12'",
  "exchange-calendars==4.13.2; python_version >= '3.12'",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]
web = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
server = [
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
]

[project.scripts]
marketpulse = "marketpulse.cli:app"
marketpulse-api = "marketpulse.web_api:main"
search-report-api = "marketpulse.investigation.server:main"
search-report-supervisor = "marketpulse.investigation.operations.supervisor:main"
search-report-backup = "marketpulse.investigation.operations.backup_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "marketpulse/investigation/persistence/alembic.ini"
"migrations" = "marketpulse/investigation/persistence/migrations"

[tool.hatch.build.targets.sdist]
include = [
  "src/marketpulse",
  "tests",
  "migrations",
  "alembic.ini",
  "README.md",
  "pyproject.toml",
]
exclude = ["/.uv-cache/**", "/.phase3-*/**", "/.pytest-work/**"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-work"
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "live: requires real network access and DEEPSEEK_API_KEY",
  "infrastructure: requires dedicated PostgreSQL or Redis test service",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["marketpulse"]
