, \"仅有半年度报告片段，缺少完整审计与行业独立核查。\" ], \"catalysts\": [ \"刻蚀设备付运与验收节奏披露\", \"现金回收与合同负债相关披露\" ], \"invalidation_conditions\": [ \"若后续披露显示收入增长放缓或验收延迟，则看多依据减弱。\", \"若现金回收恶化或研发费用刚性上升侵蚀利润，则看多依据减弱。\" ], \"next_checks\": [ \"补查应收账款、存货与合同负债披露\", \"补查刻蚀设备订单与验收节奏披露\" ], \"scenarios\": [ { \"scenario_id\": \"S1\", \"kind\": \"BASE\", \"text\": \"若收入增长与现金流改善延续，经营表现可能保持稳健。\", \"claim_ids\": [ \"C1\", \"C3\" ], \"conditions\": [ \"刻蚀设备付运与验收节奏平稳\", \"现金回收未明显恶化\" ] }, { \"scenario_id\": \"S2\", \"kind\": \"IMPROVEMENT\", \"text\": \"若高端刻蚀设备付运与验收加快且现金回收改善，经营表现可能进一步向好。\", \"claim_ids\": [ \"C1\", \"C3\" ], \"conditions\": [ \"订单与验收节奏加快\", \"应收账款与存货周转改善\" ] }, { \"scenario_id\": \"S3\", \"kind\": \"DETERIORATION\", \"text\": \"若验收延迟或现金回收恶化，收入增长与利润可能承压。\", \"claim_ids\": [ \"C1\", \"C2\", \"C3\" ], \"conditions\": [ \"验收节奏放缓\", \"应收账款或存货占用上升\" ] } ], \"direction_reason\": \"正面依据为公司披露收入与利润增长、现金流改善，且高端刻蚀设备付运提升；反面依据为研发投入刚性、现金回收细节未明。正面依据更占优，故倾向看多，但需补证确认。\", \"direction_claim_ids\": [ \"C1\", \"C2\", \"C3\" ] }, \"review\": { \"decisions\": [ { \"claim_id\": \"C1\", \"verdict\": \"APPROVE\", \"reason\": \"原文明确披露营业收入同比增长，并说明主要来自先进逻辑和存储器件关键刻蚀工艺高端产品新增付运量显著提升、多种关键刻蚀工艺实现大规模量产，转述与原文一致，未夸大。\" }, { \"claim_id\": \"C2\", \"verdict\": \"APPROVE\", \"reason\": \"原文披露利润总额与归母净利润同比大幅增长，公司称主要因收入增长带动毛利增加，同时研发投入同比上升且占营业收入比例维持高位，均标注为公司披露或公司称，未冒充独立证实。\" }, { \"claim_id\": \"C3\", \"verdict\": \"NEED_EVIDENCE\", \"reason\": \"原文仅披露经营活动现金流量净额同比增长及净资产、总资产较上年度末增长，未披露应收账款、存货变动与回款节奏，claim中现金回收与资产扩张匹配的机制缺乏原文支撑。\" } ], \"scenarios_supported\": true, \"opinion_supported\": true, \"conclusion_verdict\": \"APPROVE\", \"conclusion_reason\": \"倾向看多基于已批准的收入利润增长与现金流改善披露，同时列明研发刚性、现金回收未明等反证与失效条件，未由经营改善直接推股价上涨，也未编造行业景气或估值判断，取舍合理。\" }, \"evidence_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\", \"EV-close-2026-10-12\" ], \"analysis_ref\": \"blob://sha256/33bcf3f0c767aaa3a645303a4a326982daa94bf1122d45187d5bb775b748f0dd\", \"review_ref\": \"blob://sha256/eef1cfd73ba04c8956d9459c681e6b19bd137490d4a02d5fece88d345facd7c3\", \"context_ref\": \"blob://sha256/57105ae6b9ad8e7de4ff35c7443e7ec592a93d65696345506ae45f5117144179\", \"new_evidence\": [ { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-020a8e984e8dbe30397b167c-1-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1225455464\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-08-04/1225455464.PDF\", \"raw_ref\": \"blob://sha256/020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"content_hash\": \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/5bf6640b0a21edd954dd1680114740851432ddda8eaa645ed555dca3d942d6aa\", \"page\": 1, \"start\": 0, \"end\": 678 }, \"text\": \"证券代码：688012 证券简称：中微公司 公告编号：2026-075\\n中微半导体设备（上海）股份有限公司\\n2026 年半年度业绩预告的自愿性披露公告\\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述\\n或者重大遗漏，并对其内容的真实性、准确性和完整性依法承担法律责任。\\n重要内容提示：\\n 中微半导体设备（上海）股份有限公司（以下简称“公司”）预计 2026\\n年半年度营业收入约 66.91 亿元，同比增加约 17.31 亿元，同比增长约 34.89%。\\n 公司预计 2026 年半年度实现归属于母公司所有者的净利润为 27 亿元到\\n29 亿元，同比增加 282.48%到 310.81%。\\n 公司已开发出 54 种高端半导体设备，包括 26 种高能和低能等离子体刻\\n蚀机设备，24 种各类薄膜设备、化学机械抛光设备和量检测设备。刻蚀和薄膜设\\n备的加工的精度已经达到了原子级水平。截至 2026 年 6 月底，公司累计已有超\\n过 8800 个反应台在国内外 220 余条生产线实现量产。公司新产品研发速度显著\\n加快，未来公司有望更大规模地推出有竞争力的新设备，并顺利进入市场。2026\\n年上半年公司研发投入约 20.42 亿元，同比增加 5.50 亿元，同比增长约 36.89%，\\n2026 年上半年研发投入占公司营业收入比例约为 30.52%，远高于科创板上市公\\n司的平均研发投入水平（10%~15%）。\\n一、本期业绩预告情况\\n（一）业绩预告期间\\n2026 年 1 月 1 日至 2026 年 6 月 30 日。\\n（二）业绩预告情况\", \"published_at\": \"2026-08-03T16:00:00Z\", \"observed_at\": null, \"period_start\": \"2026-01-01\", \"period_end\": \"2026-06-30\", \"fetched_at\": \"2026-10-12T14:19:04.143880Z\", \"available_at\": \"2026-10-12T14:19:04.143880Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-020a8e984e8dbe30397b167c-3-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1225455464\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-08-04/1225455464.PDF\", \"raw_ref\": \"blob://sha256/020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"content_hash\": \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/5bf6640b0a21edd954dd1680114740851432ddda8eaa645ed555dca3d942d6aa\", \"page\": 3, \"start\": 0, \"end\": 607 }, \"text\": \"年营业收入增长 34.89%，毛利较去年增长约 6.82 亿元；（2）2026 年上半年公\\n司研发投入约 20.42 亿元，同比增加 5.50 亿元（增长约 36.89%），2026 年上半\\n年研发投入占公司营业收入比例约为 30.52%，远高于科创板上市公司的平均研\\n发投入水平（10%~15%）。2026 年上半年研发费用约 13.10 亿元，较去年增长约\\n1.93 亿元（增长约 17.31%）；（3）经评估师评估初步结果，公司以公允价值计\\n量且其变动计入当期损益的对外股权投资于 2026 年上半年产生公允价值变动收\\n益和投资收益合计约 19.82 亿元，较 2025 年上半年的 1.68 亿元增加约 18.15 亿\\n元。\\n3、2026 年上半年，公司扣非后归母净利润为 10 亿元到 12 亿元，同比增加\\n4.61 亿元至 6.61 亿元（增长约 85.61%到 122.73%）的主要原因： 2026 年上半年\\n营业收入增长 34.89%，毛利较去年增长约 6.82 亿元，以及 2026 年上半年研发费\\n用较去年增长约 1.93 亿元。\\n四、风险提示\\n公司不存在影响本次业绩预告内容准确性的重大不确定因素。\\n五、其他说明事项\\n以上预告数据仅为初步核算数据，具体准确的财务数据以公司正式披露的\\n2026 年半年报为准，敬请广大投资者注意投资风险。\\n特此公告。\\n中微半导体设备（上海）股份有限公司董事会\", \"published_at\": \"2026-08-03T16:00:00Z\", \"observed_at\": null, \"period_start\": \"2026-01-01\", \"period_end\": \"2026-06-30\", \"fetched_at\": \"2026-10-12T14:19:04.143880Z\", \"available_at\": \"2026-10-12T14:19:04.143880Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-7a6ef069963d540aaf873582-1-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1224986821\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-02-28/1224986821.PDF\", \"raw_ref\": \"blob://sha256/7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"content_hash\": \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/0cd29b13989fe2da944a31c190d25a38c5fe5ee80648c5ff39d369eea36c9d92\", \"page\": 1, \"start\": 0, \"end\": 827 }, \"text\": \"证券代码：688012 证券简称：中微公司 公告编号：2026-014\\n中微半导体设备（上海）股份有限公司\\n2025 年度业绩快报公告\\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述\\n或者重大遗漏，并对其内容的真实性、准确性和完整性依法承担法律责任。\\n重要内容提示：\\n 中微半导体设备（上海）股份有限公司（以下简称“公司”）2025 年营业\\n收入约 123.85 亿元，较 2024 年增加约 33.19 亿元，同比增长约 36.62%。\\n 根据市场需求，公司加大研发力度，新产品数量快速增加。2025 年全年\\n公司研发投入约 37.44 亿元，较 2024 年增长 12.91 亿元（增长约 52.65%），研\\n发投入占公司营业收入比例约为 30.23%。\\n 公司预计 2025 年度实现归属于母公司所有者的净利润约为 21.11 亿元，\\n与上年同期（法定披露数据）相比，增加约 4.96 亿元，同比增加约 30.69%。\\n 公司 2025 年度实现归属于母公司所有者的扣除非经常性损益的净利润\\n约为 15.50 亿元，与上年同期（法定披露数据）相比，增加约 1.62 亿元，同比增\\n加约 11.64%。\\n 公司针对先进逻辑和存储器件制造中关键刻蚀工艺的高端产品新增付运\\n量显著提升，先进逻辑器件中段关键刻蚀工艺和先进存储器件的超高深宽比刻蚀\\n工艺实现了稳定可靠的大规模量产。其中 CCP 方面，公司用于关键刻蚀工艺的\\n单反应台介质刻蚀产品保持高速增长，能够全面覆盖存储器刻蚀应用中各类超高\\n深宽比需求；ICP 方面，适用于下一代逻辑和存储客户用 ICP 刻蚀设备和化学气\\n相刻蚀设备开发取得了良好进展，加工的精度和重复性已达到单原子水平。到\\n2025 年底，公司累计已有超过 7,800 个反应台在国内外 170 余条客户芯片及 LED\\n生产线全面量产，其中刻蚀设备反应台全球累计出货超过 6,800 台。公司的 CDP\", \"published_at\": \"2026-02-27T16:00:00Z\", \"observed_at\": null, \"period_start\": null, \"period_end\": null, \"fetched_at\": \"2026-10-12T14:19:04.321851Z\", \"available_at\": \"2026-10-12T14:19:04.321851Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\", \"报告注明未经审计。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-7a6ef069963d540aaf873582-3-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1224986821\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-02-28/1224986821.PDF\", \"raw_ref\": \"blob://sha256/7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"content_hash\": \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/0cd29b13989fe2da944a31c190d25a38c5fe5ee80648c5ff39d369eea36c9d92\", \"page\": 3, \"start\": 0, \"end\": 850 }, \"text\": \"的每股净资产（元）\\n注：1、本报告期初数同法定披露的上年年末数。\\n2、以上财务数据及指标以合并报表数据填列，但未经审计，最终结果以公司 2025\\n年年度报告为准。\\n二、经营业绩和财务状况情况说明\\n（一）报告期的经营情况、财务状况及影响经营业绩的主要因素\\n1、报告期的经营情况、财务状况\\n公司 2025 年营业收入约 123.85 亿元，较 2024 年增加约 33.19 亿元，同比增\\n长约 36.62%。其中，2025 年刻蚀设备销售约 98.32 亿元，同比增长约 35.12%；\\nLPCVD 和 ALD 设备销售约 5.06 亿元，同比增长约 224.23%。\\n2025 年归属于母公司所有者的净利润约 21.11 亿元，较上年同期增加 30.69%，\\n主要原因如下：（1）2025 年营业收入增长 36.62%下，毛利较去年增长约 11.28\\n亿元。（2）由于市场对中微开发多种新设备的需求急剧增长，2025 年公司加大\\n研发力度，以尽快弥补国产半导体设备短板，积极赶超，为长期持续增长打好基\\n础。2025 年公司研发投入约 37.44 亿元，较去年增长 12.91 亿元，同比增长约\\n52.65%，2025 年研发投入占公司营业收入比例约为 30.23%，远高于科创板均值。\\n2025 年研发费用 24.75 亿元，较去年增长约 10.58 亿元，同比增长约 74.61%。（3）\\n由于二级市场股价波动以及公司出售了部分持有的上市公司股票，经评估师评估，\\n公司 2025 年计入非经常性损益的股权投资收益为 6.07 亿元，较上年同期的股权\\n投资收益 1.98 亿元增加约 4.09 亿元。\\n2025 年归属于母公司所有者的扣除非经常性损益的净利润约 15.50 亿元，较\\n上年同期增加 11.64%，本期增长的主要原因：由于 2025 年营业收入增长 36.62%，\\n毛利较去年增长约 11.28 亿元，以及 2025 年研发费用较去年增长约 10.58 亿元。\\n于报告期末，公司总资产约\", \"published_at\": \"2026-02-27T16:00:00Z\", \"observed_at\": null, \"period_start\": null, \"period_end\": null, \"fetched_at\": \"2026-10-12T14:19:04.321851Z\", \"available_at\": \"2026-10-12T14:19:04.321851Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\", \"报告注明未经审计。\" ], \"value\": null, \"unit\": null } ], \"supplements\": [ { \"query\": \"中微公司 应收账款 存货 合同负债 回款\", \"purpose\": \"应收账款与存货变动、合同负债及回款节奏的披露，用于判断现金回收是否可持续。\", \"new_evidence_ids\": [ \"EV-DOC-020a8e984e8dbe30397b167c-1-0\", \"EV-DOC-020a8e984e8dbe30397b167c-3-0\", \"EV-DOC-7a6ef069963d540aaf873582-1-0\", \"EV-DOC-7a6ef069963d540aaf873582-3-0\" ], \"new_original_hashes\": [ \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\" ], \"note\": \"定向读取本次基础取证已归档、此前未提供分析角色的其他原文；同文重复不算新增。\" } ] }, { \"round\": 1, \"proposal\": { \"claims\": [ { \"claim_id\": \"C1\", \"claim_type\": \"observation\", \"text\": \"公司披露上半年营业收入同比增长，主要来自先进逻辑和存储器件关键刻蚀工艺高端产品新增付运量显著提升，多种关键刻蚀工艺实现大规模量产。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若高端刻蚀设备付运与量产验收延续，可能支撑收入继续增长；待验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [], \"support_level\": \"MODERATE\", \"verification_status\": \"PENDING\", \"supersedes_id\": null }, { \"claim_id\": \"C2\", \"claim_type\": \"observation\", \"text\": \"公司披露利润总额与归母净利润同比大幅增长，公司称主要因收入增长带动毛利增加，同时研发投入同比上升且占营业收入比例维持高位。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若收入增长与毛利改善延续，可能支撑利润；但研发投入刚性上升可能部分抵消，待验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [], \"support_level\": \"MODERATE\", \"verification_status\": \"PENDING\", \"supersedes_id\": null }, { \"claim_id\": \"C3\", \"claim_type\": \"observation\", \"text\": \"公司披露经营活动产生的现金流量净额同比增长，同时归属于上市公司股东的净资产和总资产较上年度末增长。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若现金回收与资产扩张匹配，可能支撑经营质量；但应收账款与存货变动未明，待验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [ \"G1\" ], \"support_level\": \"WEAK\", \"verification_status\": \"PENDING\", \"supersedes_id\": null } ], \"gaps\": [ { \"gap_id\": \"G1\", \"claim_id\": \"C3\", \"need\": \"应收账款、存货变动与合同负债回款节奏，用于判断现金回收是否与收入扩张匹配。\", \"materiality\": \"HIGH\", \"allowed_tool\": \"financial\", \"arguments_json\": \"{\\\"query\\\":\\\"688012.SH 应收账款 存货 合同负债 经营活动现金流量\\\"}\", \"expected_benefit\": \"确认现金回收质量，验证或否定经营现金流改善的持续性。\", \"status\": \"OPEN\" }, { \"gap_id\": \"G2\", \"claim_id\": \"C2\", \"need\": \"毛利率与研发费用率的进一步拆分，用于判断利润增长中经营性与非经常性因素的构成。\", \"materiality\": \"MEDIUM\", \"allowed_tool\": \"disclosures\", \"arguments_json\": \"{\\\"query\\\":\\\"688012.SH 毛利率 研发费用 非经常性损益 公允价值变动\\\"}\", \"expected_benefit\": \"区分利润增长中可持续经营贡献与一次性投资收益贡献。\", \"status\": \"OPEN\" } ], \"outlook\": \"FAVORABLE\", \"stance\": \"PRIORITIZE_RESEARCH\", \"summary\": \"倾向看多：收入与利润增长有公司披露支撑，但现金回收与利润构成待验证。\", \"opposing_reasons\": [ \"公司披露的利润增长中含对外股权投资公允价值变动与投资收益，属非经常性因素，若剔除后经营利润增速明显低于净利润增速。\", \"研发投入占营业收入比例维持高位且同比上升，费用刚性可能持续压制扣非利润弹性。\", \"应收账款、存货与合同负债回款节奏未在现有片段披露，现金回收能否与收入扩张匹配尚不明确。\" ], \"catalysts\": [ \"公司后续披露完整半年度报告，补充毛利率、应收账款与存货明细。\", \"公司披露新产品付运与量产验收进展，验证收入增长延续性。\", \"公司披露合同负债与回款情况，验证现金回收质量。\" ], \"invalidation_conditions\": [ \"若后续披露显示收入增长主要来自非经常性因素或一次性确认，则收入增长机制失效。\", \"若研发费用率继续上升且毛利改善不足以覆盖，则利润增长机制被削弱。\", \"若应收账款与存货显著上升而经营现金流回落，则现金回收改善判断失效。\" ], \"next_checks\": [ \"查阅完整半年度报告中的应收账款、存货与合同负债明细。\", \"查阅毛利率与研发费用率拆分，区分经营性与非经常性利润贡献。\", \"查阅公司披露的新产品付运与量产验收节奏，验证收入延续性。\" ], \"scenarios\": [ { \"scenario_id\": \"S1\", \"kind\": \"BASE\", \"text\": \"若收入增长延续且研发费用率维持高位，利润可能保持增长但扣非弹性受限。\", \"claim_ids\": [ \"C1\", \"C2\" ], \"conditions\": [ \"高端刻蚀设备付运与量产验收延续\", \"研发投入占营业收入比例维持高位\" ] }, { \"scenario_id\": \"S2\", \"kind\": \"IMPROVEMENT\", \"text\": \"若现金回收与收入扩张匹配且毛利改善延续，经营质量可能进一步改善。\", \"claim_ids\": [ \"C1\", \"C3\" ], \"conditions\": [ \"应收账款与存货变动与收入扩张匹配\", \"经营活动现金流量净额延续增长\" ] }, { \"scenario_id\": \"S3\", \"kind\": \"DETERIORATION\", \"text\": \"若研发费用刚性上升且现金回收放缓，利润与经营质量可能承压。\", \"claim_i