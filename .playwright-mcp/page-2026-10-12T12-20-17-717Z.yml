现金回收与利润匹配度未明。\", \"仅有公司披露片段，缺少独立行业与资金验证。\" ], \"catalysts\": [ \"后续披露合同负债与存货对应交付节点\", \"后续披露应收账款周转与回款数据\" ], \"invalidation_conditions\": [ \"若后续披露显示收入增长未对应实际交付或验收延迟，则收入驱动判断需下调。\", \"若经营现金流持续显著低于净利润且应收存货占用上升，则现金回收判断需下调。\" ], \"next_checks\": [ \"查合同负债与存货变动对应交付节点\", \"查应收账款周转与经营现金流差异科目\" ], \"scenarios\": [ { \"scenario_id\": \"S1\", \"kind\": \"BASE\", \"text\": \"若后续披露显示交付节点与收入确认匹配、回款同步，则经营与现金回收维持当前节奏。\", \"claim_ids\": [ \"C1\", \"C3\" ], \"conditions\": [ \"合同负债与存货变动可对应具体交付节点\", \"应收账款周转与收入增长同步\" ] }, { \"scenario_id\": \"S2\", \"kind\": \"IMPROVEMENT\", \"text\": \"若高端刻蚀产品付运持续放量且回款改善，则收入与现金回收可能同步向好。\", \"claim_ids\": [ \"C1\", \"C3\" ], \"conditions\": [ \"高端产品付运量继续提升\", \"经营现金流与净利润差距收窄\" ] }, { \"scenario_id\": \"S3\", \"kind\": \"DETERIORATION\", \"text\": \"若研发费用维持高位且非经常性收益不可持续、回款滞后，则利润与现金回收可能承压。\", \"claim_ids\": [ \"C2\", \"C3\" ], \"conditions\": [ \"研发费用率维持高位\", \"应收账款或存货占用上升\" ] } ] }, \"review\": { \"decisions\": [ { \"claim_id\": \"C1\", \"verdict\": \"APPROVE\", \"reason\": \"原文披露营业收入与归母净利润同比大幅增长，并明确公司称增长主要来自先进逻辑和存储器件关键刻蚀工艺高端产品新增付运量显著提升、实现大规模量产；claim已标注为公司披露且待独立验证，未冒充独立证实。\" }, { \"claim_id\": \"C2\", \"verdict\": \"APPROVE\", \"reason\": \"原文同时列示归母净利润与扣非净利润增速差异，并披露研发投入占营业收入比例约三成，claim据此指出利润结构对非经常性损益与研发费用敏感，属对披露数据的合理观察，未推断利润必增或必减。\" }, { \"claim_id\": \"C3\", \"verdict\": \"APPROVE\", \"reason\": \"原文披露经营活动现金流量净额同比增长但绝对额低于同期归母净利润，claim仅指出现金回收与利润匹配程度尚不明确，未从合同负债或应收存货推完整订单，属基于披露的合理观察。\" } ], \"scenarios_supported\": true, \"opinion_supported\": true }, \"evidence_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\", \"EV-close-2026-10-12\" ], \"analysis_ref\": \"blob://sha256/adbb3421121775aafe80f59cabfac339cac6edf2a22185f72e81f126844728ee\", \"review_ref\": \"blob://sha256/7136caa566472445b767af627aaac0363c93a5b960e585dd4c77e1f22c3b744a\", \"context_ref\": \"blob://sha256/c5988f1090c2959eb9fdbf76b62e4326d7220b0dc8aec222133a9562939bcd6a\", \"new_evidence\": [ { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-020a8e984e8dbe30397b167c-1-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1225455464\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-08-04/1225455464.PDF\", \"raw_ref\": \"blob://sha256/020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"content_hash\": \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/5bf6640b0a21edd954dd1680114740851432ddda8eaa645ed555dca3d942d6aa\", \"page\": 1, \"start\": 0, \"end\": 678 }, \"text\": \"证券代码：688012 证券简称：中微公司 公告编号：2026-075\\n中微半导体设备（上海）股份有限公司\\n2026 年半年度业绩预告的自愿性披露公告\\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述\\n或者重大遗漏，并对其内容的真实性、准确性和完整性依法承担法律责任。\\n重要内容提示：\\n 中微半导体设备（上海）股份有限公司（以下简称“公司”）预计 2026\\n年半年度营业收入约 66.91 亿元，同比增加约 17.31 亿元，同比增长约 34.89%。\\n 公司预计 2026 年半年度实现归属于母公司所有者的净利润为 27 亿元到\\n29 亿元，同比增加 282.48%到 310.81%。\\n 公司已开发出 54 种高端半导体设备，包括 26 种高能和低能等离子体刻\\n蚀机设备，24 种各类薄膜设备、化学机械抛光设备和量检测设备。刻蚀和薄膜设\\n备的加工的精度已经达到了原子级水平。截至 2026 年 6 月底，公司累计已有超\\n过 8800 个反应台在国内外 220 余条生产线实现量产。公司新产品研发速度显著\\n加快，未来公司有望更大规模地推出有竞争力的新设备，并顺利进入市场。2026\\n年上半年公司研发投入约 20.42 亿元，同比增加 5.50 亿元，同比增长约 36.89%，\\n2026 年上半年研发投入占公司营业收入比例约为 30.52%，远高于科创板上市公\\n司的平均研发投入水平（10%~15%）。\\n一、本期业绩预告情况\\n（一）业绩预告期间\\n2026 年 1 月 1 日至 2026 年 6 月 30 日。\\n（二）业绩预告情况\", \"published_at\": \"2026-08-03T16:00:00Z\", \"observed_at\": null, \"period_start\": \"2026-01-01\", \"period_end\": \"2026-06-30\", \"fetched_at\": \"2026-10-12T09:42:23.342815Z\", \"available_at\": \"2026-10-12T09:42:23.342815Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-020a8e984e8dbe30397b167c-3-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1225455464\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-08-04/1225455464.PDF\", \"raw_ref\": \"blob://sha256/020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"content_hash\": \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/5bf6640b0a21edd954dd1680114740851432ddda8eaa645ed555dca3d942d6aa\", \"page\": 3, \"start\": 0, \"end\": 607 }, \"text\": \"年营业收入增长 34.89%，毛利较去年增长约 6.82 亿元；（2）2026 年上半年公\\n司研发投入约 20.42 亿元，同比增加 5.50 亿元（增长约 36.89%），2026 年上半\\n年研发投入占公司营业收入比例约为 30.52%，远高于科创板上市公司的平均研\\n发投入水平（10%~15%）。2026 年上半年研发费用约 13.10 亿元，较去年增长约\\n1.93 亿元（增长约 17.31%）；（3）经评估师评估初步结果，公司以公允价值计\\n量且其变动计入当期损益的对外股权投资于 2026 年上半年产生公允价值变动收\\n益和投资收益合计约 19.82 亿元，较 2025 年上半年的 1.68 亿元增加约 18.15 亿\\n元。\\n3、2026 年上半年，公司扣非后归母净利润为 10 亿元到 12 亿元，同比增加\\n4.61 亿元至 6.61 亿元（增长约 85.61%到 122.73%）的主要原因： 2026 年上半年\\n营业收入增长 34.89%，毛利较去年增长约 6.82 亿元，以及 2026 年上半年研发费\\n用较去年增长约 1.93 亿元。\\n四、风险提示\\n公司不存在影响本次业绩预告内容准确性的重大不确定因素。\\n五、其他说明事项\\n以上预告数据仅为初步核算数据，具体准确的财务数据以公司正式披露的\\n2026 年半年报为准，敬请广大投资者注意投资风险。\\n特此公告。\\n中微半导体设备（上海）股份有限公司董事会\", \"published_at\": \"2026-08-03T16:00:00Z\", \"observed_at\": null, \"period_start\": \"2026-01-01\", \"period_end\": \"2026-06-30\", \"fetched_at\": \"2026-10-12T09:42:23.342815Z\", \"available_at\": \"2026-10-12T09:42:23.342815Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-7a6ef069963d540aaf873582-1-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1224986821\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-02-28/1224986821.PDF\", \"raw_ref\": \"blob://sha256/7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"content_hash\": \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/0cd29b13989fe2da944a31c190d25a38c5fe5ee80648c5ff39d369eea36c9d92\", \"page\": 1, \"start\": 0, \"end\": 827 }, \"text\": \"证券代码：688012 证券简称：中微公司 公告编号：2026-014\\n中微半导体设备（上海）股份有限公司\\n2025 年度业绩快报公告\\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述\\n或者重大遗漏，并对其内容的真实性、准确性和完整性依法承担法律责任。\\n重要内容提示：\\n 中微半导体设备（上海）股份有限公司（以下简称“公司”）2025 年营业\\n收入约 123.85 亿元，较 2024 年增加约 33.19 亿元，同比增长约 36.62%。\\n 根据市场需求，公司加大研发力度，新产品数量快速增加。2025 年全年\\n公司研发投入约 37.44 亿元，较 2024 年增长 12.91 亿元（增长约 52.65%），研\\n发投入占公司营业收入比例约为 30.23%。\\n 公司预计 2025 年度实现归属于母公司所有者的净利润约为 21.11 亿元，\\n与上年同期（法定披露数据）相比，增加约 4.96 亿元，同比增加约 30.69%。\\n 公司 2025 年度实现归属于母公司所有者的扣除非经常性损益的净利润\\n约为 15.50 亿元，与上年同期（法定披露数据）相比，增加约 1.62 亿元，同比增\\n加约 11.64%。\\n 公司针对先进逻辑和存储器件制造中关键刻蚀工艺的高端产品新增付运\\n量显著提升，先进逻辑器件中段关键刻蚀工艺和先进存储器件的超高深宽比刻蚀\\n工艺实现了稳定可靠的大规模量产。其中 CCP 方面，公司用于关键刻蚀工艺的\\n单反应台介质刻蚀产品保持高速增长，能够全面覆盖存储器刻蚀应用中各类超高\\n深宽比需求；ICP 方面，适用于下一代逻辑和存储客户用 ICP 刻蚀设备和化学气\\n相刻蚀设备开发取得了良好进展，加工的精度和重复性已达到单原子水平。到\\n2025 年底，公司累计已有超过 7,800 个反应台在国内外 170 余条客户芯片及 LED\\n生产线全面量产，其中刻蚀设备反应台全球累计出货超过 6,800 台。公司的 CDP\", \"published_at\": \"2026-02-27T16:00:00Z\", \"observed_at\": null, \"period_start\": null, \"period_end\": null, \"fetched_at\": \"2026-10-12T09:42:23.548698Z\", \"available_at\": \"2026-10-12T09:42:23.548698Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\", \"报告注明未经审计。\" ], \"value\": null, \"unit\": null }, { \"schema_version\": \"decision-v1\", \"evidence_id\": \"EV-DOC-7a6ef069963d540aaf873582-2-0\", \"subject_id\": \"688012.SH\", \"kind\": \"disclosure\", \"source_family\": \"CNINFO\", \"original_source_id\": \"CNINFO:1224986821\", \"url\": \"https://static.cninfo.com.cn/finalpage/2026-02-28/1224986821.PDF\", \"raw_ref\": \"blob://sha256/7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"content_hash\": \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\", \"locator\": { \"kind\": \"pdf\", \"path\": \"blob://sha256/0cd29b13989fe2da944a31c190d25a38c5fe5ee80648c5ff39d369eea36c9d92\", \"page\": 2, \"start\": 0, \"end\": 846 }, \"text\": \"产品部门为先进存储器件和逻辑器件开发的 LPCVD, ALD 等十多款导体和介质\\n薄膜设备已经顺利进入市场，并且设备性能完全达到国际领先水平，薄膜设备的\\n覆盖率不断增加。公司 EPI 设备研发团队已经开发出具有自主知识产权及创新的\\n平台，目前减压 EPI 设备已付运成熟制程客户进行量产验证，该种设备同时也付\\n运至先进制程客户进行验证，部分先进工艺已进入量产验证阶段；新一代高选择\\n比预清洁腔体满足先进工艺的需求，已在客户端进行量产验证；常压外延设备现\\n已完成开发，进入工艺验证阶段。在泛半导体设备领域，公司正在开发更多化合\\n物半导体外延设备，已陆续付运至客户端进行验证。\\n本公告所载2025年度主要财务数据为初步核算数据，未经会计师事务所审计，\\n具体数据以公司2025年年度报告中披露的数据为准，提请投资者注意投资风险。\\n一、2025 年度主要财务数据和指标\\n单位：万元\\n项目 本报告期 上年同期 增减变动幅度\\n（％）\\n营业总收入 1,238,463.83 906,516.51 36.62%\\n营业利润 219,051.09 170,351.78 28.59%\\n利润总额 218,984.94 170,893.47 28.14%\\n归属于母公司所有者\\n的净利润 211,147.30 161,567.57 30.69%\\n归属于母公司所有者\\n的扣除非经常性损益\\n的净利润\\n154,979.64 138,815.34 11.64%\\n基本每股收益（元） 3.40 2.61 30.19%\\n加权平均净资产收益\\n率 9.98% 8.66% 增加 1.37 个百\\n分点\\n本报告期末 本报告期初 增减变动幅度\\n（％）\\n总 资 产 2,977,230.19 2,621,754.47 13.56%\\n归属于母公司的所有\\n者权益 2,269,461.68 1,973,691.23 14.99%\\n股 本 62,614.53 62,236.37 0.61%\\n归属于母公司所有者 36.24 31.71 14.29%\", \"published_at\": \"2026-02-27T16:00:00Z\", \"observed_at\": null, \"period_start\": null, \"period_end\": null, \"fetched_at\": \"2026-10-12T09:42:23.548698Z\", \"available_at\": \"2026-10-12T09:42:23.548698Z\", \"availability_basis\": \"FIRST_FETCH\", \"availability_proof_ref\": null, \"time_precision\": \"day\", \"method_version\": \"lexical-typed-v1\", \"quality_status\": \"AVAILABLE\", \"limitations\": [ \"公司披露中的解释是公司陈述，不等于独立证实的因果。\", \"首次取得时点作为可用时点，公告日期不证明历史可得。\", \"报告注明未经审计。\" ], \"value\": null, \"unit\": null } ], \"supplements\": [ { \"query\": \"中微公司 合同负债 存货 收入确认 验收周期 产品线\", \"purpose\": \"刻蚀与薄膜沉积等主要产品线的收入确认节奏、验收周期及合同负债与存货变动对应的交付节点。\", \"new_evidence_ids\": [ \"EV-DOC-020a8e984e8dbe30397b167c-1-0\", \"EV-DOC-020a8e984e8dbe30397b167c-3-0\", \"EV-DOC-7a6ef069963d540aaf873582-1-0\", \"EV-DOC-7a6ef069963d540aaf873582-2-0\" ], \"new_original_hashes\": [ \"020a8e984e8dbe30397b167cdbb468bd7bdec0667923490c674b18ed70f425fc\", \"7a6ef069963d540aaf8735828219febfd3e81c02f2c4b6a3a607105d118c0fd9\" ], \"note\": \"定向读取本次基础取证已归档、此前未提供分析角色的其他原文；同文重复不算新增。\" }, { \"query\": \"中微公司 经营活动现金流 应收账款 存货 营运资金 变动\", \"purpose\": \"经营现金流与净利润差异的营运资金科目构成，以及销售回款与应收账款周转是否同步于收入增长。\", \"new_evidence_ids\": [], \"new_original_hashes\": [], \"note\": \"定向读取本次基础取证已归档、此前未提供分析角色的其他原文；同文重复不算新增。\" } ] }, { \"round\": 1, \"proposal\": { \"claims\": [ { \"claim_id\": \"C1\", \"claim_type\": \"observation\", \"text\": \"公司披露上半年营业收入与归母净利润同比大幅增长，公司称主要来自先进逻辑和存储器件关键刻蚀工艺高端产品新增付运量显著提升并实现大规模量产。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若高端刻蚀产品付运与量产持续，可能支撑收入与毛利；但该解释来自公司披露，尚待独立验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [ \"G1\" ], \"support_level\": \"MODERATE\", \"verification_status\": \"PENDING\", \"supersedes_id\": null }, { \"claim_id\": \"C2\", \"claim_type\": \"observation\", \"text\": \"公司披露扣非净利润增速明显低于归母净利润增速，且研发投入占营业收入比例约三成，利润结构对非经常性损益与研发费用较为敏感。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若研发费用维持高位或非经常性收益不可持续，利润增速可能回落；待验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [ \"G2\" ], \"support_level\": \"MODERATE\", \"verification_status\": \"PENDING\", \"supersedes_id\": null }, { \"claim_id\": \"C3\", \"claim_type\": \"observation\", \"text\": \"公司披露经营活动现金流量净额同比增长，但绝对额明显低于同期归母净利润，现金回收与利润的匹配程度尚不明确。\", \"subject_ids\": [ \"688012.SH\" ], \"horizon\": \"MEDIUM_TERM\", \"support_ids\": [ \"EV-DOC-182e2062fed950cd32310099-7-0\" ], \"counter_ids\": [], \"mechanism\": \"若应收账款或存货占用上升，经营现金流可能继续滞后于利润；待验证。\", \"alternative_claim_ids\": [], \"gap_ids\": [ \"G2\" ], \"support_level\": \"WEAK\", \"verification_status\": \"PENDING\", \"supersedes_id\": null } ], \"gaps\": [ { \"gap_id\": \"G1\", \"claim_id\": \"C1\", \"need\": \"刻蚀与薄膜等主要产品线的收入确认节奏、验收周期及合同负债与存货变动能否对应具体交付节点，用以独立验证公司所称付运与量产驱动。\", \"materiality\": \"HIGH\", \"allowed_tool\": \"disclosures\", \"arguments_json\": \"{\\\"query\\\":\\\"中微公司 合同负债 存货 收入确认 验收周期\\\"}\", \"expected_benefit\": \"确认收入增长是否由可核查的交付节点支撑，而非仅凭公司口径。\", \"status\": \"OPEN\" }, { \"gap_id\": \"G2\", \"claim_id\": \"C2\", \"need\": \"毛利率与研发费用率在最近几个报告期的变动，以及销售回款与应收账款周转是否同步于收入增长，公司披露是否给出可核查说明。\", \"materiality\": \"HIGH\", \"allowed_tool\": \"financial\", \"arguments_json\": \"{\\\"query\\\":\\\"中微公司 毛利率 研发费用率 应收账款周转 经营现金流\\\"}\", \"expected_benefit\": \"区分利润结构对非经常性损益与研发费用的敏感度，并判断现金回收与利润的匹配程度。\", \"status\": \"OPEN\" } ], \"outlook\": \"UNDETERMINED\", \"stance\": \"PRIORITIZE_RESEARCH\", \"summary\": \"公司披露收入与利润大幅增长，但现金回收与利润匹配、非经常性损益占比及研发费用影响尚待补证，方向暂难定。\", \"opposing_reasons\": [ \"公司披露的利润高增含较大非经常性损益成分，扣非增速明显较低，利润质量待验证。\", \"经营现金流绝对额低于同期归母净利润，现金回收与利润匹配程度不明确。\", \"现有证据仅来自公司披露，缺少独立行业与资金验证，不能据此推断行业景气或股价方向。\" ], \"catalysts\": [ \"后续定期报告披露合同负债、存货与应收账款明细，可核查交付节点与回款节奏。\", \"公司披露毛利率与研发费用率变动原因，可验证利润结构解释。\" ], \"invalidation_conditions\": [ \"若后续披露显示收入增长并非来自高端刻蚀产品付运与量产，则公司所称驱动原因被否定。\", \"若经营现金流持续显著低于净利润且应收账款或存货占用上升，则现金回收匹配判断需下调。\" ], \"next_checks\": [ \"查阅后续定期报告中合同负债、存货与收入确认政策，核对交付节点。\", \"查阅财务数据中毛利率、研发费用率与应收账款周转，验证利润结构与回款节奏。\" ], \"scenarios\": [ { \"scenario_id\": \"S1\", \"kind\": \"BASE\", \"text\": \"若公司披露的付运与量产节奏延续，且合同负债与存货变动能对应交付节点，收入与毛利可能维持当前披露水平。\", \"claim_ids\": [ \"C1\" ], \"conditions\": [ \"后续披露显示高端刻蚀产品付运与量产持续。\", \"合同负债与存货变动可对应具体交付节点。\" ] }, { \"scenario_id\": \"S2\", \"kind\": \"IMPROVEMENT\", \"text\": \"若研发费用率趋稳且非经常性损益之外的经营利润同步改善，利润结构可能更均衡。\", \"claim_ids\": [ \"C2\" ], \"conditions\": [ \"后续披露显示扣非利润增速与归母利润增速差距收窄。\", \"研发费用率不再显著上升。\" ] }, { \"scenario_id\": \"S3\", \"kind\": \"DETERIORATION\", \"text\":